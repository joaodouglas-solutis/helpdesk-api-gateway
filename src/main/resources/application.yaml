spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            - id: ticket-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/tickets/**
              filters:
                - StripPrefix=1

            - id: notification-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info